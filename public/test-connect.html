<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>融云 IM 连接测试</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', monospace;
      background: #0d1117; color: #c9d1d9; padding: 24px;
      min-height: 100vh;
    }
    h1 { font-size: 18px; margin-bottom: 16px; color: #58a6ff; }
    .card {
      background: #161b22; border: 1px solid #30363d; border-radius: 8px;
      padding: 20px; margin-bottom: 16px;
    }
    .log { font-size: 13px; line-height: 1.6; white-space: pre-wrap; word-break: break-all; }
    .log .ok { color: #3fb950; }
    .log .err { color: #f85149; }
    .log .warn { color: #d29922; }
    .log .info { color: #58a6ff; }
    button {
      background: #238636; color: white; border: none; padding: 10px 24px;
      border-radius: 6px; cursor: pointer; font-size: 14px; margin-right: 8px;
    }
    button:hover { background: #2ea043; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    button.danger { background: #da3633; }
    button.danger:hover { background: #f85149; }
    .status-bar { font-size: 14px; padding: 8px 0; }
    .status-bar .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; }
    .status-bar .dot.connected { background: #3fb950; }
    .status-bar .dot.connecting { background: #d29922; animation: pulse 1s infinite; }
    .status-bar .dot.disconnected { background: #484f58; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
  </style>
</head>
<body>
  <h1>🔌 融云 IM SDK 连接测试</h1>
  <div class="card">
    <div id="status" class="status-bar">
      <span class="dot disconnected"></span>
      <span id="statusText">未连接</span>
    </div>
    <div style="margin: 12px 0; font-size: 13px;">
      <div>AppKey: <code style="color:#58a6ff">mgb7ka1nm8v4g</code></div>
      <div>Token:  <code style="color:#58a6ff">8qRB+OsaRpcu911yWhcDR...@em38.cn.rongnav.com;em38.cn.rongcfg.com</code></div>
    </div>
    <div>
      <button id="btnConnect" onclick="doConnect()">🔗 连接</button>
      <button id="btnDisconnect" class="danger" onclick="doDisconnect()" disabled>断开</button>
    </div>
  </div>
  <div class="card">
    <div class="log" id="log"></div>
  </div>

  <script type="module">
    let SDK = null;
    let connected = false;

    const logEl = document.getElementById('log');
    const statusDot = document.querySelector('.dot');
    const statusText = document.getElementById('statusText');
    const btnConnect = document.getElementById('btnConnect');
    const btnDisconnect = document.getElementById('btnDisconnect');

    function log(msg, type = 'info') {
      const cls = { ok: 'ok', err: 'err', warn: 'warn', info: 'info' }[type] || 'info';
      const time = new Date().toLocaleTimeString('zh-CN', { hour12: false });
      const line = document.createElement('div');
      line.className = cls;
      line.textContent = `[${time}] ${msg}`;
      logEl.appendChild(line);
      logEl.scrollTop = logEl.scrollHeight;
    }

    const APP_KEY = 'mgb7ka1nm8v4g';
    const RAW_TOKEN = '8qRB+OsaRpcu911yWhcDR+9sJxxg4uFv+GIOCQ9MNK0=@em38.cn.rongnav.com;em38.cn.rongcfg.com';

    function parseToken(rawToken) {
      const atIdx = rawToken.lastIndexOf('@');
      if (atIdx === -1) return { token: rawToken, navigators: [] };
      const realToken = rawToken.slice(0, atIdx);
      const hostPart = rawToken.slice(atIdx + 1);
      const allHosts = hostPart.split(';').map(s => s.trim()).filter(Boolean);
      const navHosts = allHosts.filter(h => h.includes('rongnav'));
      const candidates = navHosts.length > 0 ? navHosts : allHosts.slice(0, 1);
      const navigators = candidates.map(h => h.startsWith('http') ? h : `https://${h}`);
      return { token: realToken, navigators };
    }

    window.doConnect = async function () {
      btnConnect.disabled = true;
      statusDot.className = 'dot connecting';
      statusText.textContent = '连接中...';

      try {
        // Step 1: Load SDK
        log('📦 正在加载 SDK...');
        const module = await import('/node_modules/@rongcloud/imlib-next/index.esm.js?t=' + Date.now());
        SDK = module;
        const exports = Object.keys(SDK).filter(k => /^[a-z]/.test(k)).slice(0, 15);
        log(`✅ SDK 加载成功，导出函数：${exports.join(', ')}`, 'ok');
        log(`   SDK 是否有 destroy: ${typeof SDK.destroy}`, 'info');
        log(`   SDK 是否有 BaseMessage: ${typeof SDK.BaseMessage}`, 'info');
        log(`   SDK 是否有 TextMessage: ${typeof SDK.TextMessage}`, 'info');

        // Step 2: Parse token
        const { token: realToken, navigators } = parseToken(RAW_TOKEN);
        log(`🔍 Token 解析：realToken=${realToken.slice(0, 20)}... navigators=${JSON.stringify(navigators)}`);

        // Step 3: Destroy any previous instance
        try {
          await SDK.destroy();
          log('🧹 destroy() 调用成功', 'ok');
        } catch (e) {
          log(`⚠️ destroy() 失败（可忽略）: ${e.message}`, 'warn');
        }

        // Step 4: Init with navigators
        const initConfig = {
          appkey: APP_KEY,
          navigators: navigators,
          environment: 'private',
          useNaviV2: true,
        };
        log(`🔧 init config: ${JSON.stringify(initConfig)}`);
        SDK.init(initConfig);
        log('✅ init() 完成', 'ok');

        // Step 5: Add event listeners
        SDK.addEventListener(SDK.Events.CONNECTING, () => log('🔄 CONNECTING 事件', 'info'));
        SDK.addEventListener(SDK.Events.CONNECTED, () => {
          log('🎉 CONNECTED 事件触发！', 'ok');
          statusDot.className = 'dot connected';
          statusText.textContent = '已连接';
          connected = true;
          btnConnect.disabled = true;
          btnDisconnect.disabled = false;
        });
        SDK.addEventListener(SDK.Events.DISCONNECT, (code) => {
          log(`🔌 DISCONNECT 事件，code=${code}`, 'err');
          statusDot.className = 'dot disconnected';
          statusText.textContent = `已断开 (code=${code})`;
          connected = false;
          btnConnect.disabled = false;
          btnDisconnect.disabled = true;
        });
        SDK.addEventListener(SDK.Events.SUSPEND, (code) => {
          log(`⏸️ SUSPEND 事件，code=${code}`, 'warn');
        });
        SDK.addEventListener(SDK.Events.MESSAGES, (evt) => {
          log(`📩 MESSAGES 事件，数量=${evt.messages?.length}`, 'info');
        });

        // Step 6: Connect
        log(`🔗 正在连接... token=${realToken.slice(0, 30)}...`);
        const result = await SDK.connect(realToken);
        log(`📊 connect 结果: code=${result.code}, userId=${result.data?.userId || 'N/A'}`);

        if (result.code === 0) {
          log(`✅ 连接成功！userId=${result.data.userId}`, 'ok');
          statusDot.className = 'dot connected';
          statusText.textContent = `已连接 · ${result.data.userId}`;
          connected = true;
          btnConnect.disabled = true;
          btnDisconnect.disabled = false;
        } else {
          log(`❌ 连接失败！code=${result.code}`, 'err');
          statusDot.className = 'dot disconnected';
          statusText.textContent = `连接失败 (code=${result.code})`;
          btnConnect.disabled = false;
        }
      } catch (e) {
        log(`💥 异常: ${e.message}\n${e.stack?.slice(0, 300)}`, 'err');
        statusDot.className = 'dot disconnected';
        statusText.textContent = `错误: ${e.message}`;
        btnConnect.disabled = false;
      }
    };

    window.doDisconnect = async function () {
      if (!SDK || !connected) return;
      try {
        await SDK.disconnect();
        log('👋 disconnect() 完成', 'ok');
        await SDK.destroy();
        log('🧹 destroy() 完成', 'ok');
      } catch (e) {
        log(`⚠️ 断开异常: ${e.message}`, 'warn');
      }
      statusDot.className = 'dot disconnected';
      statusText.textContent = '未连接';
      connected = false;
      btnConnect.disabled = false;
      btnDisconnect.disabled = true;
    };

    log('🚀 测试页面就绪，点击「连接」开始测试');
    log(`   目标导航服务器: https://em38.cn.rongnav.com`);
  </script>
</body>
</html>
